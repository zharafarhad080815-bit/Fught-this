<!--In this activity, you will build a food diary page about your favourite foods. The page has four huge display headings that go from giant to large. Your name appears in small text inside the last heading. A key food fact is highlighted in yellow using mark. The abbreviation BBQ reveals its full name when you hover over it. A famous food quote is styled with a chocolate left border using blockquote.-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <!--Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Food Diary</title>
        <style>
            /* Internal CSS */
            body {
                font-family: Arial, sans-serif;
                background-color: #fff8dc; /* Light background color */
                margin: 0;
                padding: 0;
                color: #333;
            }
            h1 {
                font-size: 4em; /* Giant heading */
                text-align: center;
                margin-top: 20px;
            }
            h2 {
                font-size: 3em; /* Large heading */
                text-align: center;
                margin-top: 20px;
            }
            h3 {
                font-size: 2em; /* Medium heading */
                text-align: center;
                margin-top: 20px;
            }
            h4 {
                font-size: 1.5em; /* Small heading */
                text-align: center;
                margin-top: 20px;
            }
            .small-text {
                font-size: 0.8em; /* Small text inside the last heading */
            }
            mark {
                background-color: yellow; /* Highlighted key food fact */
            }
            abbr[title] {
                border-bottom: 1px dotted; /* Dotted underline for abbreviation */
                cursor: help; /* Cursor changes to help icon on hover */
            }
            blockquote {
                border-left: 5px solid chocolate; /* Chocolate left border for quote */
                padding-left: 10px;
                margin-left: 20px;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1>My Food Diary</h1>
        <h2>Favourite Foods</h2>
        <h3>Delicious Dishes</h3>
        <h4>My Name <span class="small-text">(Zhara)</span></h4>

        <p><mark>Did you know that honey never spoils?</mark></p>

        <p>The abbreviation <abbr title="Barbecue">BBQ</abbr> is commonly used in recipes.</p>

        <blockquote>"One cannot think well, love well, sleep well, if one has not dined well." - Virginia Woolf</blockquote>
</body>
</html>
